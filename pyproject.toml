[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bibdocqmd"
version = "0.1.0"
description = "Quarto-native citation management for Microsoft Word"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "lxml>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "python-docx>=1.1,<2",
]

[project.scripts]
bibdocqmd-export = "bibdocqmd.export:main"
bibword-export = "bibdocqmd.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bibdocqmd = ["styles/*.csl", "filters/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
