<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>bibdocqmd file selection</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 id="dialog-heading">Select local files</h1>
    <p>Files are read locally and returned to your Word task pane.</p>
    <label for="dialog-files" id="dialog-label">Choose files</label>
    <input id="dialog-files" type="file" disabled>
    <p id="dialog-status" role="status" aria-live="polite">Connecting to Word…</p>
    <button id="dialog-cancel" type="button" class="secondary" disabled>Cancel</button>
  </main>
  <script src="file-picker-dialog.js"></script>
</body>
</html>
